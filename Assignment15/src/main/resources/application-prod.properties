# Production Profile Configuration (Railway/Production)
# Activate with: -Dspring.profiles.active=prod or SPRING_PROFILES_ACTIVE=prod
# In Railway, set SPRING_PROFILES_ACTIVE=prod as an environment variable

# Database Configuration - Production (from Railway environment variables)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration - Production
spring.jpa.hibernate.ddl-auto=validate
# In production, use 'validate' or 'none' to prevent accidental schema changes
# Run migrations manually using the SQL scripts
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Logging Configuration - Less verbose for production
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.root=INFO
# OAuth2 Google Configuration - Production (OPTIONAL)
# If you want to use Google OAuth login, set these environment variables in Railway:
# - GOOGLE_CLIENT_ID
# - GOOGLE_CLIENT_SECRET  
# - GOOGLE_REDIRECT_URI (e.g., https://your-app.up.railway.app/login/oauth2/code/google)
# If not set, only username/password login will be available
# Note: Commented out by default. Uncomment and set environment variables to enable.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.redirect-uri=${GOOGLE_REDIRECT_URI}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# Session Cookie Configuration for Production (HTTPS)
# These settings ensure session cookies work properly in production
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.timeout=30m

# Disable default Spring Security user in production
# Remove or comment out if you want to disable it
# spring.security.user.name=
# spring.security.user.password=

