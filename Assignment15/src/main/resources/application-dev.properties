# Development Profile Configuration (Local Host)
# Activate with: -Dspring.profiles.active=dev or SPRING_PROFILES_ACTIVE=dev

# Database Configuration - Local MySQL
# Update these values to match your local MySQL setup
spring.datasource.url=jdbc:mysql://localhost:3306/momtracker_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Splungebob96!
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration - Development
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging Configuration - More verbose for development
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# OAuth2 Google Configuration - Development
# Set these in your environment or update with your local OAuth credentials
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:your-dev-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:your-dev-client-secret}
spring.security.oauth2.client.registration.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8080/login/oauth2/code/google}

# Spring Security Default User (for development/testing)
spring.security.user.name=${SECURITY_USER_NAME:user}
spring.security.user.password=${SECURITY_USER_PASSWORD:{noop}Password123!}

