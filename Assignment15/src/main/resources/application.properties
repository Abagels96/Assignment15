# Default Application Configuration
# Profile-specific settings will override these

spring.application.name=Assignment15-MomTracker-Abigail
spring.profiles.active=dev

# Session Management (shared across all profiles)
spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=always

# Session Cookie Configuration for Development (HTTP)
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.http-only=true
server.servlet.session.timeout=30m

# JPA/Hibernate defaults (can be overridden by profiles)
spring.jpa.open-in-view=false

# OAuth2 scope (shared)
spring.security.oauth2.client.registration.google.scope=profile,email