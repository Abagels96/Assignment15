spring.application.name=Assignment15-MomTracker-Abigail

# Server Configuration
# Railway sets PORT environment variable, default to 8080 for local development
server.port=${PORT:8080}

# Database Configuration
# Railway provides JDBC_DATABASE_URL (jdbc:mysql://) for MySQL
# If not set, use local MySQL for development
spring.datasource.url=${JDBC_DATABASE_URL:jdbc:mysql://localhost:3306/MomTracker}
spring.datasource.username=${JDBC_DATABASE_USERNAME:root}
spring.datasource.password=${JDBC_DATABASE_PASSWORD:Splungebob96!}
spring.jpa.hibernate.ddl-auto=update
# Explicitly set database platform for Spring Session JDBC initialization
# Defaults to MySQL dialect, auto-detected from URL if not set
spring.jpa.database-platform=${DATABASE_PLATFORM:org.hibernate.dialect.MySQLDialect}
# Explicitly set driver class name to help Spring Session JDBC determine database type
spring.datasource.driver-class-name=${DATABASE_DRIVER:}

# JPA/Hibernate Configuration
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${FORMAT_SQL:true}
spring.jpa.properties.hibernate.globally_quoted_identifiers=false

# Logging Configuration
logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:DEBUG}

# OAuth2 Google Configuration
# Use environment variables for production, with localhost defaults for development
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:757667480872-9q46r011vr7vp9ph08jfgfhbkr00479e.apps.googleusercontent.com}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET: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}
spring.security.oauth2.client.registration.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8080/login/oauth2/code/google}
spring.security.oauth2.client.registration.google.scope=openid, profile, email
spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo
spring.security.oauth2.client.provider.google.jwk-set-uri=https://www.googleapis.com/oauth2/v3/certs
spring.security.oauth2.client.provider.google.issuer-uri=https://accounts.google.com

# Spring Security Default User (for development/testing)
spring.security.user.name=${SECURITY_USER_NAME:user}
spring.security.user.password=${SECURITY_USER_PASSWORD:{noop}Password123!}

# Spring Session JDBC Configuration
# Explicitly enable JDBC session store
spring.session.store-type=jdbc
# Initialize Spring Session tables automatically (always, never, or embedded)
spring.session.jdbc.initialize-schema=always
