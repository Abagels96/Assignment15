# Base Application Configuration (Shared across all profiles)
# This file is always loaded first, then profile-specific configs override/extend it

spring.application.name=Assignment15-MomTracker-Abigail

# Default profile for local development (will be overridden by environment variable in production)
spring.profiles.active=dev

# Session Management (shared across all profiles)
spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=always

# JPA/Hibernate defaults (can be overridden by profiles)
spring.jpa.open-in-view=false

# OAuth2 scope (shared - only applies if OAuth2 client credentials are provided)
spring.security.oauth2.client.registration.google.scope=profile,email