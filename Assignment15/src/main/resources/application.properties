# Default Application Configuration
# Profile-specific settings will override these

spring.application.name=Assignment15-MomTracker-Abigail
spring.profiles.active=dev

# Session Management (shared across all profiles)
spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=always
# Google OAuth credentials are loaded from environment variables
# Set GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, and GOOGLE_REDIRECT_URI
# as env vars or in a local .env file (never commit secrets to git)

# Session Cookie Configuration for Development (HTTP)
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.http-only=true
server.servlet.session.timeout=30m

# JPA/Hibernate defaults (can be overridden by profiles)
spring.jpa.open-in-view=false